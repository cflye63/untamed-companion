        - generic [ref=e180]:
          - heading "🩹 Conditions" [level=2] [ref=e181]
          - generic [ref=e182]:
            - generic [ref=e183]:
              - strong [ref=e184]: 💀 Poisoned
              - text: — Disadvantage on attack rolls and CON saves. 1 dmg at start of turn until treated.
            - generic [ref=e185]:
              - strong [ref=e186]: 🩸 Bleeding
              - text: — 1d4 HP at end of turn per stack. Gain a stack on Dash or move > 15 ft.
              - emphasis [ref=e187]: "Remedy: First Aid INT DC 12 or any healing."
            - generic [ref=e188]:
              - strong [ref=e189]: 🔥 Burned
              - text: — 1d4 fire at end of turn. Disadvantage on Concentration.
              - emphasis [ref=e190]: "Remedy: Water (then Soaked)."
            - generic [ref=e191]:
              - strong [ref=e192]: ❄️ Chilled
              - text: — +1 STA cost to all abilities. −10 ft movement.
            - generic [ref=e193]:
              - strong [ref=e194]: 💧 Soaked
              - text: — Lightning damage ×2. End of turn CON DC 12 or gain Chilled.
              - emphasis [ref=e195]: "Remedy: Fire / heat."
            - generic [ref=e196]:
              - strong [ref=e197]: 💫 Staggered
              - text: — No Move or Action until next turn. Fast and Reactions OK.
            - generic [ref=e198]:
              - strong [ref=e199]: ⚡ Stunned
              - text: — Lose next turn entirely. Attacks vs you have advantage. Auto-fail STR/DEX saves until end of next turn.
            - generic [ref=e200]:
              - strong [ref=e201]: ⛓️ Paralyzed
              - text: — No Move, Action, Fast, or Reaction until next turn. Attacks vs you have advantage.
            - generic [ref=e202]:
              - strong [ref=e203]: 😰 Exhausted
              - text: — STA = 0. No Actions or Fast. Attacks vs you have advantage. Auto-fail STR/DEX saves. Move halved.
              - emphasis [ref=e204]: Recover +4 STA at end of turn if you take no Action.
            - generic [ref=e205]:
              - strong [ref=e206]: 🤕 Prone
              - text: "— Melee vs you: advantage. Ranged vs you: disadvantage. Your ranged: disadvantage."
              - emphasis [ref=e207]: "Stand: 2 STA."
            - generic [ref=e208]:
              - strong [ref=e209]: 🤼 Grappled
              - text: — Speed 0. Disadvantage vs forced movement.
              - emphasis [ref=e210]: "Break: STR or DEX vs grappler at start of turn."
            - generic [ref=e211]:
              - strong [ref=e212]: 🕸️ Restrained
              - text: — Speed 0. Disadvantage on DEX saves. Cannot Dodge. Attacks vs you have advantage.
            - generic [ref=e213]:
              - strong [ref=e214]: 😡 Taunted
              - text: — Next attack must target the taunter. Ends after that attack or if untargetable.
            - generic [ref=e215]:
              - strong [ref=e216]: 😵 Dazed
              - text: — Disadvantage on attack rolls and Instinct checks. No Reactions. Ends at end of next turn.
            - generic [ref=e217]:
              - strong [ref=e218]: 😴 Sleep
              - text: "— Lose turn, regain 4 STA. Wake on INS at end of turn or on damage. Attacks vs Sleeping: advantage."
