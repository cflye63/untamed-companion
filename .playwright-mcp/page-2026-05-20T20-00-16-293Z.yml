        - generic [ref=e169]:
          - heading "🧩 Monster Behavior Archetypes" [level=2] [ref=e170]
          - paragraph [ref=e171]: Every monster in Untamed should fit into 1–2 primary archetypes (with Apex monsters blending 3+).
          - paragraph [ref=e172]: Each archetype is a behavioral pattern — how the creature approaches combat, movement, and territory.
          - paragraph [ref=e173]: They're not rigid AI scripts, but instinctive loops — "If hurt, do this. If cornered, do that."
          - generic [ref=e174]:
            - heading "Brute" [level=3] [ref=e175]
            - paragraph [ref=e176]: "Behavior: Dominance through power and proximity."
            - paragraph [ref=e177]: "Stats: High STR/CON."
            - paragraph [ref=e178]: "Instinct Loop: Close distance → trade blows → roar or charge when pressured."
            - paragraph [ref=e179]: "GM Tip: Telegraph attacks clearly; reward clever positioning or staggering."
            - paragraph [ref=e180]: "Example: Urmine, Ironhide Boar."
          - generic [ref=e181]:
            - heading "Skirmisher" [level=3] [ref=e182]
            - paragraph [ref=e183]: "Behavior: Speed, repositioning, and opportunistic strikes."
            - paragraph [ref=e184]: "Stats: High DEX/INS."
            - paragraph [ref=e185]: "Instinct Loop: Circle → jab → retreat → bait pursuit."
            - paragraph [ref=e186]: "GM Tip: Burn hunter stamina through pursuit and distance control."
            - paragraph [ref=e187]: "Example: Cliff Strider, Ridge Wraith."
          - generic [ref=e188]:
            - heading "Kiter (Ranged Predator)" [level=3] [ref=e189]
            - paragraph [ref=e190]: "Behavior: Maintains distance; inflicts pressure through projectiles, breath, or traps."
            - paragraph [ref=e191]: "Stats: High INS/DEX."
            - paragraph [ref=e192]: "Instinct Loop: Keep line-of-sight → punish approach → relocate when cornered."
            - paragraph [ref=e193]: "GM Tip: Play smart; use elevation and cover as survival tools."
            - paragraph [ref=e194]: "Example: Kragal, Sporeback Basilisk."
          - generic [ref=e195]:
            - heading "Ambusher" [level=3] [ref=e196]
            - paragraph [ref=e197]: "Behavior: Strikes when unseen; relies on camouflage or timing."
            - paragraph [ref=e198]: "Stats: High INS/DEX."
            - paragraph [ref=e199]: "Instinct Loop: Wait → isolate → burst → vanish → repeat."
            - paragraph [ref=e200]: "GM Tip: Treat each strike as a story beat — something learned or countered next time."
            - paragraph [ref=e201]: "Example: Noctilura, Mire Panther."
          - generic [ref=e202]:
            - heading "Guardian" [level=3] [ref=e203]
            - paragraph [ref=e204]: "Behavior: Territorial and defensive; protects nests, zones, or lesser monsters."
            - paragraph [ref=e205]: "Stats: Very high CON, sometimes INS."
            - paragraph [ref=e206]: "Instinct Loop: Hold ground → punish intrusion → enrage if home or allies are harmed."
            - paragraph [ref=e207]: "GM Tip: Use lair actions and environmental control to emphasize dominance."
            - paragraph [ref=e208]: "Example: Terraguard Beetle, Hive Matron."
          - generic [ref=e209]:
            - heading "Shifter (Environmental Controller)" [level=3] [ref=e210]
            - paragraph [ref=e211]: "Behavior: Alters terrain or weather mid-fight; thrives in chaos."
            - paragraph [ref=e212]: "Stats: Vary widely; often linked to INT or CON."
            - paragraph [ref=e213]: "Instinct Loop: Manipulate environment → punish movement → adapt to new hazards."
            - paragraph [ref=e214]: "GM Tip: Think of it as \"fighting the arena as much as the monster.\""
            - paragraph [ref=e215]: "Example: Stagmir, Sandwurm, Deep Coral Warden."
          - generic [ref=e216]:
            - heading "Tool User" [level=3] [ref=e217]
            - paragraph [ref=e218]: "Behavior: Wields objects or exploits surroundings; demonstrates learned behavior."
            - paragraph [ref=e219]: "Stats: High INT/INS."
            - paragraph [ref=e220]: "Instinct Loop: Use tools to extend reach → adapt mid-fight → retreat to regroup if disarmed."
            - paragraph [ref=e221]: "GM Tip: Give them \"problem-solving\" moments — players should recognize evolving tactics."
            - paragraph [ref=e222]: "Example: Rockbreak Ape, Mud Sentinel."
          - generic [ref=e223]:
            - heading "Debuffer" [level=3] [ref=e224]
            - paragraph [ref=e225]: "Behavior: Uses toxins, sounds, spores, or curses to cripple prey."
            - paragraph [ref=e226]: "Stats: High CHA; often low CON."
            - paragraph [ref=e227]: "Instinct Loop: Apply status → withdraw → harass weakened targets."
            - paragraph [ref=e228]: "GM Tip: Don't overuse; one status effect per \"phase\" feels fair and cinematic."
            - paragraph [ref=e229]: "Example: Venom Toad, Frost Moth."
          - generic [ref=e230]:
            - heading "Support / Synergist" [level=3] [ref=e231]
            - paragraph [ref=e232]: "Behavior: Bolsters allies, heals, or enhances coordination."
            - paragraph [ref=e233]: "Stats: Moderate across board; relies on pack logic."
            - paragraph [ref=e234]: "Instinct Loop: Buff or guard → reposition → rejoin alpha."
            - paragraph [ref=e235]: "GM Tip: Use this archetype in multi-monster fights; they make the ecology feel alive."
            - paragraph [ref=e236]: "Example: Pack Howler, Hive Conductor."
          - generic [ref=e237]:
            - heading "Tactician (Pack Alpha)" [level=3] [ref=e238]
            - paragraph [ref=e239]: "Behavior: Coordinates others; thrives in numbers."
            - paragraph [ref=e240]: "Stats: Balanced but with high INS/CHA (command presence)."
            - paragraph [ref=e241]: "Instinct Loop: Command → delegate → punish isolation."
            - paragraph [ref=e242]: "GM Tip: Give the alpha \"pack reactions\" — when it howls or signals, others react."
            - paragraph [ref=e243]: "Example: Vorvarg Alpha, Frost Talon Matriarch."
          - generic [ref=e244]:
            - heading "Flyer" [level=3] [ref=e245]
            - paragraph [ref=e246]: "Behavior: Controls verticality; dictates engagement range."
            - paragraph [ref=e247]: "Stats: High DEX; moderate CON."
            - paragraph [ref=e248]: "Instinct Loop: Scout → dive → retreat upward → strafe."
            - paragraph [ref=e249]: "GM Tip: Let hunters \"ground\" flyers with terrain or timing to shift the phase."
            - paragraph [ref=e250]: "Example: Earule, Gale Wyvern."
          - generic [ref=e251]:
            - heading "Swimmer / Aquatic" [level=3] [ref=e252]
            - paragraph [ref=e253]: "Behavior: Masters underwater or shoreline combat; controls oxygen and movement."
            - paragraph [ref=e254]: "Stats: High CON/STR."
            - paragraph [ref=e255]: "Instinct Loop: Drag prey → drown → surface or ambush near edges."
            - paragraph [ref=e256]: "GM Tip: Make terrain matter — oxygen, currents, visibility."
            - paragraph [ref=e257]: "Example: Leviathan, Murkfin Croc."
          - generic [ref=e258]:
            - heading "Intelligent / Apex Hybrid" [level=3] [ref=e259]
            - paragraph [ref=e260]: "Behavior: Combines archetypes intelligently; recognizes patterns and adapts."
            - paragraph [ref=e261]: "Stats: All high; unique modifiers."
            - paragraph [ref=e262]: "Instinct Loop: Observe → counter → escalate → transform terrain or self."
            - paragraph [ref=e263]: "GM Tip: Let it learn — reward player pattern recognition with equal monster adaptation."
            - paragraph [ref=e264]: "Example: Apex Wyvern, The Stagmir."
          - generic [ref=e265]:
            - heading "🧭 GM Use" [level=3] [ref=e266]
            - paragraph [ref=e267]: "When designing or running a monster:"
            - list [ref=e268]:
              - listitem [ref=e269]: Pick 1–2 archetypes (3+ for Apex).
              - listitem [ref=e270]: Note Instinct Loops (your "AI core").
              - listitem [ref=e271]: Add 1 unique behavior quirk ("always roars before charging," "favors attacking torches").
              - listitem [ref=e272]: Tie those behaviors to threshold triggers — HP, stamina, or environmental states.
            - paragraph [ref=e273]: These loops replace static "attack tables." They make fights evolve.
          - generic [ref=e274]:
            - 'heading "🦴 Bonus: Archetype Synergies" [level=3] [ref=e275]'
            - paragraph [ref=e276]: "Some combinations make iconic encounters:"
            - list [ref=e277]:
              - listitem [ref=e278]:
                - strong [ref=e279]: "Brute + Shifter:"
                - text: Unstoppable force that changes the battlefield as it fights.
              - listitem [ref=e280]:
                - strong [ref=e281]: "Ambusher + Debuffer:"
                - text: Assassin predator that weakens and evades.
              - listitem [ref=e282]:
                - strong [ref=e283]: "Guardian + Support:"
                - text: Defends allies or structures; perfect "boss + adds" setups.
              - listitem [ref=e284]:
                - strong [ref=e285]: "Flyer + Kiter:"
                - text: Aerial artillery.
              - listitem [ref=e286]:
                - strong [ref=e287]: "Tactician + Tool User:"
                - text: Intelligent alpha; turns fights into puzzles.
              - listitem [ref=e288]:
                - strong [ref=e289]: "Swimmer + Shifter:"
                - text: Floods zones or manipulates water currents as cover.
        - generic [ref=e290]:
          - heading "Monster Classifications" [level=2] [ref=e291]
          - blockquote [ref=e292]: "\"Every creature in the wild fills a role — predator, prey, parasite, or god. When you understand what it eats, what it fears, and what it protects, you understand how to hunt it.\""
          - paragraph [ref=e293]: Monster classifications exist to help GMs design encounters that feel ecologically grounded. Each classification defines how a creature behaves, evolves, and interacts with the environment and the hunt loop.
          - heading "🐾 Standard Classifications" [level=3] [ref=e294]
          - paragraph [ref=e295]: These creatures form the majority of the ecosystem — from small prey to apex-level hunters. They populate most hunts and define the ecological identity of each biome.
          - generic [ref=e296]:
            - heading "Beast Rodents" [level=3] [ref=e297]
            - paragraph [ref=e298]: "Profile: Skittish scavengers or opportunists at the base of the food chain."
            - paragraph [ref=e299]: "Common Traits: Small-to-medium size, quick breeding, tunneling, or nest-building behavior."
            - paragraph [ref=e300]: "Behavior Archetypes: Skirmisher, Ambusher (burrow), Pack, Tool User."
            - paragraph [ref=e301]: "GM Use: Excellent \"sign creatures\" — their absence signals larger predators nearby."
          - generic [ref=e302]:
            - heading "Beast Birds" [level=3] [ref=e303]
            - paragraph [ref=e304]: "Profile: Aerial hunters and scavengers that define the vertical layers of a biome."
            - paragraph [ref=e305]: "Common Traits: Flight, dive attacks, keen eyesight, social nesting behaviors."
            - paragraph [ref=e306]: "Behavior Archetypes: Flyer, Kiter, Skirmisher."
            - paragraph [ref=e307]: "GM Use: Great for multi-level arenas and high-ground control; use to teach players about visibility and range management."
          - generic [ref=e308]:
            - heading "Fanged Beasts" [level=3] [ref=e309]
            - paragraph [ref=e310]: "Profile: Agile mammalian predators that stalk or ambush prey using precision and instinct."
            - paragraph [ref=e311]: "Common Traits: High DEX or INS, bleed mechanics, stealth, territorial aggression."
            - paragraph [ref=e312]: "Behavior Archetypes: Ambusher, Pack/Tactician, Brute (for apex species)."
            - paragraph [ref=e313]: "GM Use: Use fanged beasts to showcase stamina attrition and tracking pressure over time."
          - generic [ref=e314]:
            - heading "Horned Beasts" [level=3] [ref=e315]
            - paragraph [ref=e316]: "Profile: Hoofed climbers, grazers, and ridge-runners that survive via mobility, altitude advantage, and impact violence (horns/charges)."
            - paragraph [ref=e317]: "Common Traits: Extreme footing, burst movement, knockback, cliff hazards, \"flight-adjacent\" leaps."
            - paragraph [ref=e318]: "Behavior Archetypes: Skirmisher, Evader, Territorial Defender."
            - paragraph [ref=e319]: "GM Use: Great Tier 0–2 \"terrain teachers\" — they punish reckless pursuit and reward positioning."
          - generic [ref=e320]:
            - heading "Reptile Beasts" [level=3] [ref=e321]
            - paragraph [ref=e322]: "Profile: Scaled predators — from serpentine hunters to lumbering lizards."
            - paragraph [ref=e323]: "Common Traits: Armor plating, venom, cold-blooded endurance, or regenerative abilities."
            - paragraph [ref=e324]: "Behavior Archetypes: Brute, Debuffer, Guardian."
            - paragraph [ref=e325]: "GM Use: Excellent middle-tier monsters that emphasize environmental adaptation (heat, moisture, or sun exposure)."
          - generic [ref=e326]:
            - heading "Amphibian Beasts" [level=3] [ref=e327]
            - paragraph [ref=e328]: "Profile: Dual-environment predators of wetlands and caves."
            - paragraph [ref=e329]: "Common Traits: Regeneration when wet, toxin-dispersal, long leaps, and camouflage."
            - paragraph [ref=e330]: "Behavior Archetypes: Debuffer, Ambusher, Swimmer."
            - paragraph [ref=e331]: "GM Use: Create stamina pressure through terrain — mud, water, and heat."
          - generic [ref=e332]:
            - heading "Crustacean Beasts" [level=3] [ref=e333]
            - paragraph [ref=e334]: "Profile: Hard-shelled, water-adjacent titans."
            - paragraph [ref=e335]: "Common Traits: Armor layers, pincer grabs, burrowing, tidal adaptation."
            - paragraph [ref=e336]: "Behavior Archetypes: Guardian, Brute, Shifter (terrain control via water or sand)."
            - paragraph [ref=e337]: "GM Use: Introduce multi-stage armor breaks and environmental hazards (floods, tidal shifts)."
          - generic [ref=e338]:
            - heading "Insectoids" [level=3] [ref=e339]
            - paragraph [ref=e340]: "Profile: Hive-based creatures acting in coordinated swarms or colonies."
            - paragraph [ref=e341]: "Common Traits: Carapace armor, venom, pheromone signaling, hive intelligence."
            - paragraph [ref=e342]: "Behavior Archetypes: Support, Pack, Guardian (queen), Debuffer."
