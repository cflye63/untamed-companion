      - article [ref=e141]:
        - generic [ref=e142]:
          - paragraph [ref=e143]: This chapter combines the "Monster Behavior" and "Monster Turn Flow" sections from earlier drafts. Rather than splitting instinct loops and AI patterns across multiple chapters, all monster‑facing logic lives here. Use the archetypes and instinct loops to build behavior, then follow the turn flow steps (Assess Threat → Check Stamina → Evaluate Position → Select Action → Execute → Check Retreat) during combat.
          - paragraph [ref=e144]: Monsters in Untamed are not mindless enemies. They hunt, flee, defend, and adapt based on instincts, territory needs, and survival — unless their nature or intelligence suggests otherwise. As GM, your role is to embody these instincts during hunts — making each creature feel alive, reactive, and sometimes even tragic.
        - generic [ref=e145]:
          - heading "🧠 How Monsters Think" [level=2] [ref=e146]
          - table [ref=e148]:
