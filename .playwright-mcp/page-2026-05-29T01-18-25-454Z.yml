          - paragraph [ref=e91]: "Draconic Lineage: Choose one lineage. You gain its elemental resistance and rider. Fire (Red scales): Resistance to Fire, rider — Target gains Burned (1 stack). Ice (White scales): Resistance to Cold, rider — Target gains Chilled. Storm (Violet scales): Resistance to Lightning, rider — If the target has already acted this round, deal +1 damage. Earth (Green/Brown scales): Resistance to Poison, rider — Target cannot be pushed or repositioned until end of its next turn. Air (Grey scales): Resistance to Sonic, rider — Move 5 ft after the attack without provoking opportunity attacks. Water (Blue/Seafoam scales): Resistance to Cold, rider — You or an ally within 5 ft regain 1 Stamina. Draconic Channeling: Once per turn, when you deal damage with an Attack or Technique, you may infuse it with your Draconic Element. If you do: apply your lineage's elemental rider and spend +1 additional Stamina."
