    - generic [ref=e103]:
      - heading "GM Principles vs. Rules" [level=2] [ref=e104]
      - paragraph [ref=e105]: Throughout this guide you'll see labels that signal the intent of each paragraph. When in doubt, err on the side of player clarity and fun.
      - list [ref=e106]:
        - listitem [ref=e107]:
          - generic [ref=e108]: "[Hard Rule]"
          - text: A strict mechanic or requirement you should enforce.
          - emphasis [ref=e109]: "\"A hunter can perform only one preparation action per round.\""
        - listitem [ref=e110]:
          - generic [ref=e111]: "[Soft Rule]"
          - text: A recommended guideline that can bend to context.
          - emphasis [ref=e112]: "\"Use exhaustion penalties sparingly.\""
        - listitem [ref=e113]:
          - generic [ref=e114]: "[GM Guideline]"
          - text: Advice for adjudicating situations.
          - emphasis [ref=e115]: "\"Telegraph monster attacks clearly.\""
        - listitem [ref=e116]:
          - generic [ref=e117]: "[Narrative Cue]"
          - text: Flavor text or prompts to inspire description; no mechanics attached.
        - listitem [ref=e118]:
          - generic [ref=e119]: "[Optional Module]"
          - text: Additional systems that can be toggled on or off (meal synergy, advanced pack behavior, etc.).
