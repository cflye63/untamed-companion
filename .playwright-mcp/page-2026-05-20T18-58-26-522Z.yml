    - generic [ref=e13]:
      - paragraph [ref=e14]: Game Master Guide
      - heading "Welcome to the Wild" [level=1] [ref=e15]
      - paragraph [ref=e16]: In Untamed, the world breathes through you. Every rustle in the underbrush, every storm that rolls across the valley, every roar in the distance — all of it begins with your voice and your choices. You are not a narrator in a static tale; you are the pulse of a living ecosystem that grows, fights back, and remembers.
      - paragraph [ref=e17]: "Your goal is simple: guide your hunters through a world that is both beautiful and brutal. Challenge them to think, to prepare, and to adapt — and reward their cleverness, not just their courage."
    - generic [ref=e19]:
      - heading "Your Role in the Wild" [level=2] [ref=e20]
      - generic [ref=e21]:
        - generic [ref=e22]:
          - generic [ref=e23]: 🌲
          - heading "Embody the Living World" [level=3] [ref=e24]
          - paragraph [ref=e25]: Nothing in Untamed stands still. The land shifts with the weather, monsters migrate when threatened, and even the smallest choice can ripple through the ecosystem. Portray that motion. Let the players feel that the world moves whether they act or not.
        - generic [ref=e26]:
          - generic [ref=e27]: ⚔️
          - heading "Challenge Through Tactics" [level=3] [ref=e28]
          - paragraph [ref=e29]: Every encounter should test endurance and wit. Victory is never guaranteed — it must be earned through timing, stamina, and understanding the creature's behavior. Force players to read the hunt, not just roll dice.
        - generic [ref=e30]:
          - generic [ref=e31]: 🩸
          - heading "Reflect Choices Dynamically" [level=3] [ref=e32]
          - paragraph [ref=e33]: The wild remembers. If the hunters burn a grove, the next hunt may begin in ash. If they spare a beast, it may return changed — as a rival, or as a myth. Every decision reshapes the balance of the world.
      - generic [ref=e34]:
        - paragraph [ref=e35]: This is not a tale of heroes saving kingdoms. It is a struggle for balance — hunters surviving the untamed wilds.
        - paragraph [ref=e36]: A reckless blade is a broken blade. The wild does not forgive. But it rewards those who respect the hunt.
    - generic [ref=e38]:
      - heading "The Hunt Loop at a Glance" [level=2] [ref=e39]
      - paragraph [ref=e40]: Four phases, porous on purpose. Weather, wounds, and monster behavior can kick you forward or backward. Your job is to keep the rhythm taut and the stakes real.
      - generic [ref=e41]:
        - generic [ref=e42]:
