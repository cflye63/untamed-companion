          - heading "Gathering" [level=3] [ref=e44]
          - paragraph [ref=e45]: Research · Scout · Stock Up
          - paragraph [ref=e46]: Collect rumors, identify monster traits, secure provisions, craft or upgrade gear. Spend stamina on travel and preparation.
        - generic [ref=e47]:
          - generic [ref=e48]: "2"
          - heading "Tracking" [level=3] [ref=e49]
          - paragraph [ref=e50]: Find It Before It Finds You
          - paragraph [ref=e51]: Follow tracks, analyze signs, avoid weather hazards. Perception and Instinct checks keep the trail alive.
        - generic [ref=e52]:
          - generic [ref=e53]: "3"
          - heading "Combat" [level=3] [ref=e54]
          - paragraph [ref=e55]: Stamina · Timing · Terrain
          - paragraph [ref=e56]: Manage stamina, exploit part breaks and conditions. Positioning matters. Don't forget defensive reactions and preparation actions.
        - generic [ref=e57]:
          - generic [ref=e58]: "4"
          - heading "Resolution" [level=3] [ref=e59]
          - paragraph [ref=e60]: Harvest & Fallout
          - paragraph [ref=e61]: Deliver the final blow, harvest parts, resolve conditions, narrate consequences. Adjust the biome with territory shifts.
